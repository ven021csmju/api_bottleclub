name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Offline unit tests: every external service points at an unused port.
      ENVIRONMENT: test
      PYTHONDONTWRITEBYTECODE: "1"
      RUN_REAL_INTEGRATION_TESTS: "false"
      DATABASE_URL: postgresql+psycopg://none:none@127.0.0.1:1/none_dev
      RABBITMQ_URL: amqp://none:none@127.0.0.1:1/
      MONGODB_URI: mongodb://127.0.0.1:1/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests (offline)
        run: python -m pytest -p no:cacheprovider -q tests/unit
