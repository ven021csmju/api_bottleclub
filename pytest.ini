[pytest]
testpaths = tests
pythonpath = .
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers -m "not external and not real_api and not integration and not e2e_staging and not browser_staging"
markers =
    unit: fast tests under tests/unit (applied automatically by tests/conftest.py)
    integration: tests under tests/integration that need the guarded PostgreSQL test database (applied automatically)
    external: may connect to real MongoDB/RabbitMQ; exempt from the autouse external-service block
    real_api: calls a running deployed API over HTTP (tests/real_integration); opt-in only
    e2e_staging: the whole flow against a running staging API (tests/e2e_staging, E2E_BASE_URL); opt-in only
    browser_staging: the refresh cookie in Chromium against a running staging API (tests/browser_staging, BROWSER_API_URL; Playwright); opt-in only
filterwarnings =
    ignore::DeprecationWarning
